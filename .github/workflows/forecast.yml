name: Forecast run

# Daily   02:00 ICT: month-end Nowcast + 1-3 months (Task 1) and inflow 1-7 days (Task 1B).
# Monthly 03:00 ICT on the 2nd: 12 months + every model's backtest, then the gate, weights and champion are chosen again.
# Manual: the Run button in Forecast HQ (website) or "Run workflow" here.
on:
  schedule:
    - cron: "0 19 * * *"
    - cron: "0 20 1 * *"
  workflow_dispatch:
    inputs:
      kind:
        description: daily (fast) or monthly (with backtest, slow)
        type: choice
        options: [daily, monthly]
        default: daily
      run_id:
        description: Run id made by the website (leave empty when starting here)
        type: string
        default: ""
      models:
        description: Only these model folders, comma separated (empty = all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

env:
  KIND: ${{ inputs.kind || (github.event.schedule == '0 20 1 * *' && 'monthly' || 'daily') }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_BACKEND_KEY: ${{ secrets.SUPABASE_BACKEND_KEY }}
  FORECAST_DATA_DIR: ${{ github.workspace }}/data/forecasting/1-reservoir-inflow/data/csv
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      run_id: ${{ steps.start.outputs.run_id }}
      matrix: ${{ steps.start.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Check setup
        id: check
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then echo "::notice::ยังไม่ได้ใส่ secret DATA_REPO_TOKEN จึงยังไม่รัน (ดู SETUP.md)"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.ok == 'true'
        run: pip install -r requirements/base.txt
      - name: Start run
        if: steps.check.outputs.ok == 'true'
        id: start
        run: python -m pipeline start --kind "$KIND" --trigger "${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}" --run-id "${{ inputs.run_id }}" --models "${{ inputs.models }}"
      - if: steps.check.outputs.ok == 'true'
        run: python -m pipeline step --run-id "${{ steps.start.outputs.run_id }}" --name data --status running --message "ดึงข้อมูลจาก repo private และแหล่งข้อมูลล่าสุด"
      # Data lives in the private website repo; it is never committed here
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: pabank10-png/flood-intelligence
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data
          sparse-checkout: forecasting/1-reservoir-inflow
      - if: steps.check.outputs.ok == 'true'
        name: Refresh dataset (newest RID inflow and station rain; soil moisture and ENSO/IOD on monthly runs)
        id: refresh
        working-directory: data/forecasting/1-reservoir-inflow/scripts
        run: |
          ok=1
          timeout 15m python fetch_station_rain.py >/dev/null 2>&1 || { echo "::warning::station rain not refreshed"; ok=0; }
          # monthly inputs (soil moisture, ENSO/IOD) change once a month: refresh them on monthly runs only
          if [ "$KIND" = monthly ]; then
            timeout 15m python fetch_soil_moisture.py >/dev/null 2>&1 || { echo "::warning::soil moisture not refreshed"; ok=0; }
            timeout 5m python fetch_climate_indices.py >/dev/null 2>&1 || { echo "::warning::ENSO/IOD not refreshed"; ok=0; }
          fi
          if timeout 15m python build_dataset.py >/dev/null 2>&1; then echo "built=1" >> "$GITHUB_OUTPUT"; else echo "::warning::dataset rebuild failed, using the committed CSVs"; git -C ../../.. checkout -- forecasting; echo "built=0" >> "$GITHUB_OUTPUT"; fi
          echo "sources_ok=$ok" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ok == 'true'
        name: "Pack data, encrypted (artifacts of a public repo can be downloaded by anyone)"
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
        run: tar czf - -C data forecasting/1-reservoir-inflow/data | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -out dataset.enc
      - if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: dataset.enc
          retention-days: 3
      - if: steps.check.outputs.ok == 'true'
        run: python -m pipeline step --run-id "${{ steps.start.outputs.run_id }}" --name data --status done --message "${{ steps.refresh.outputs.built == '1' && 'อัปเดตข้อมูลล่าสุดแล้ว' || 'อัปเดตไม่ได้ ใช้ข้อมูลชุดเดิมใน repo' }}"
      - if: failure() && steps.start.outputs.run_id
        run: |
          python -m pipeline step --run-id "${{ steps.start.outputs.run_id }}" --name data --status failed --message "เตรียมข้อมูลไม่สำเร็จ"
          python -m pipeline fail --run-id "${{ steps.start.outputs.run_id }}" --message "เตรียมข้อมูลไม่สำเร็จ ดู log ใน GitHub Actions"

  model:
    needs: prepare
    if: needs.prepare.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/${{ matrix.group }}.txt
      - name: Install (${{ matrix.group }})
        run: |
          pip install -r requirements/${{ matrix.group }}.txt
          if [ "${{ matrix.group }}" = foundation ]; then pip install --no-deps uni2ts; fi
      # Model weights (Chronos-2, TimesFM, Moirai) download from Hugging Face once, then come from GitHub's cache
      - if: matrix.group == 'foundation'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.id }}-v1
      - uses: actions/download-artifact@v4
        with:
          name: dataset
      - name: Unpack data
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
        run: mkdir -p data && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in dataset.enc | tar xzf - -C data && rm dataset.enc
      - name: Run ${{ matrix.model }}
        run: python -m pipeline model --run-id "${{ needs.prepare.outputs.run_id }}" --kind "$KIND" --name "${{ matrix.model }}" --out results
      - name: Pack result (encrypted)
        if: always()
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          mkdir -p results
          tar czf - results | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -out result.enc
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.id }}
          path: result.enc
          retention-days: 3
      - if: failure() || cancelled()
        run: python -m pipeline step --run-id "${{ needs.prepare.outputs.run_id }}" --name "model:${{ matrix.model }}" --status failed --message "งานบน GitHub Actions หยุดกลางทาง"

  finish:
    needs: [prepare, model]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - run: pip install -r requirements/base.txt
      - uses: actions/download-artifact@v4
        with:
          name: dataset
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: packs
      - name: Unpack
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          mkdir -p data results
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in dataset.enc | tar xzf - -C data
          for f in packs/*/result.enc; do openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in "$f" | tar xzf - || true; done
      - name: Error Gate, Combination, storage, publish
        run: python -m pipeline finish --run-id "${{ needs.prepare.outputs.run_id }}" --kind "$KIND" --results results
      - if: failure() || cancelled()
        run: python -m pipeline fail --run-id "${{ needs.prepare.outputs.run_id }}" --message "ขั้นสรุปผลไม่สำเร็จ ดู log ใน GitHub Actions"
