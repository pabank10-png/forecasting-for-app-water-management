name: Monthly origin replay 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/monthly-origin-replay.yml']

permissions:
  contents: read

concurrency:
  group: monthly-origin-replay-2026
  cancel-in-progress: false

env:
  FORECAST_DATA_DIR: ${{ github.workspace }}/private-data/forecasting/1-reservoir-inflow/data/csv
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      data_sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pabank10-png/flood-intelligence
          token: ${{ secrets.DATA_REPO_TOKEN }}
          sparse-checkout: forecasting/1-reservoir-inflow/data/csv
      - id: version
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  replay:
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: timesfm
            cache_id: task1_reservoir_monthly__11_timesfm_inflow
          - model: chronos2
            cache_id: task1_reservoir_monthly__10_chronos2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pabank10-png/flood-intelligence
          token: ${{ secrets.DATA_REPO_TOKEN }}
          ref: ${{ needs.snapshot.outputs.data_sha }}
          path: private-data
          sparse-checkout: forecasting/1-reservoir-inflow/data/csv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/foundation.txt
      - run: pip install -r requirements/foundation.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.cache_id }}-v1
      - name: Verify temporal isolation and complete horizon
        run: PYTHONPATH=. python tests/test_origin_replay.py
      - name: Replay Jan-Nov origins with existing Champion weights
        env:
          REPLAY_MODEL: ${{ matrix.model }}
        run: |
          export REPLAY_DATA_SHA="$(git -C private-data rev-parse HEAD)"
          python -m experiments.monthly_origin_replay --model "$REPLAY_MODEL" --out "results/$REPLAY_MODEL.json"
      - name: Encrypt results before uploading to public-repo artifacts
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
          REPLAY_MODEL: ${{ matrix.model }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:KEY -in "results/$REPLAY_MODEL.json" -out "$REPLAY_MODEL.enc"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.model }}
          path: '*.enc'
          retention-days: 30

  archive:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pabank10-png/flood-intelligence
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: archive
          sparse-checkout: forecasting/model-reports/origin-replay-2026
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: encrypted
          merge-multiple: true
      - name: Validate and archive full results in the private data repository
        env:
          KEY: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          out="archive/forecasting/model-reports/origin-replay-2026/$GITHUB_RUN_ID"
          mkdir -p "$out"
          for model in timesfm chronos2; do
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:KEY -in "encrypted/$model.enc" -out "$out/$model.json"
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('archive/forecasting/model-reports/origin-replay-2026')/os.environ['GITHUB_RUN_ID']
          manifest={'run_id':os.environ['GITHUB_RUN_ID'],'workflow_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",'files':[]}
          data_shas=set()
          for name,sites in [('timesfm',['DK','KY','NPL']),('chronos2',['PS'])]:
              p=root/f'{name}.json';a=json.loads(p.read_text());data_shas.add(a['data_sha'])
              assert set(a['sites'])==set(sites)
              for site in sites:
                  for kind in ['champion','climatology']:
                      rows=a['sites'][site][kind]
                      assert len(rows)==132 and len({r['origin'] for r in rows})==11
                      assert all(r['training_through']<r['origin'] and r['p50'] is not None for r in rows)
              manifest['files'].append({'name':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          assert len(data_shas)==1, 'Jobs used different dataset commits'
          manifest['data_sha']=data_shas.pop()
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          (root/'README.md').write_text('Regenerated monthly-origin forecasts, Jan-Nov 2026. Twelve steps per origin, including unknown Actuals. Current prepared history; not vintage website output. No historical Daily Nowcast. Raw Champion and Climatology per dam; THREE is the sum of DK/KY/NPL. See manifest.json for provenance.\n')
          PY
          cd archive
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "forecasting/model-reports/origin-replay-2026/$GITHUB_RUN_ID"
          git commit -m "Archive complete 2026 monthly-origin forecasts (run $GITHUB_RUN_ID)"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
